<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Cash - Bet & Earn</title>
    <!-- Icons CND -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e24;
            --primary: #4CAF50;
            --text-light: #ffffff;
            --text-muted: #a0a0a0;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-panel);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            background-color: #1a1a20;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .balance-badge {
            background-color: #2a2a35;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            border: 1px solid var(--primary);
        }

        /* Views/Sections */
        .view-section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background-color: #2a2a35;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 10px;
            text-align: center;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover, .menu-btn:active {
            background-color: #383845;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .menu-btn i {
            font-size: 28px;
            color: var(--primary);
        }

        /* Lists (Games/History) */
        .list-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .list-item:hover {
            border-color: var(--primary);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(145deg, #2a2a35, #1e1e24);
            border: 1px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .profile-stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .profile-stat:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fa-solid fa-sack-dollar"></i> Metro Cash</h1>
        <div class="balance-badge">₹ <span id="userBalance">0.00</span></div>
    </div>

    <!-- MAIN MENU VIEW -->
    <div id="mainMenu" class="view-section active">
        <div class="menu-grid">
            <div class="menu-btn" onclick="showView('profileView')">
                <i class="fa-solid fa-user"></i>
                <span>Profile / Balance</span>
            </div>
            <div class="menu-btn" onclick="showView('gamesView')">
                <i class="fa-solid fa-gamepad"></i>
                <span>Bet & Earn</span>
            </div>
            <div class="menu-btn" onclick="alert('Feature coming soon!')">
                <i class="fa-solid fa-download"></i>
                <span>Deposit</span>
            </div>
            <div class="menu-btn" onclick="alert('Feature coming soon!')">
                <i class="fa-solid fa-building-columns"></i>
                <span>Withdraw</span>
            </div>
            <div class="menu-btn" onclick="alert('Feature coming soon!')">
                <i class="fa-solid fa-gift"></i>
                <span>Bonus</span>
            </div>
            <div class="menu-btn" onclick="alert('Feature coming soon!')">
                <i class="fa-solid fa-users"></i>
                <span>Refer & Earn</span>
            </div>
        </div>
    </div>

    <!-- GAMES VIEW -->
    <div id="gamesView" class="view-section">
        <button class="back-btn" onclick="showView('mainMenu')"><i class="fa-solid fa-arrow-left"></i> Back to Menu</button>
        <h2 style="margin-bottom: 15px; color: var(--primary);">Live Games</h2>
        
        <div class="list-group">
            <div class="list-item" onclick="alert('Starting Aviator...')">
                <div><i class="fa-solid fa-plane" style="color: #00bcd4;"></i> Aviator Game</div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="list-item" onclick="alert('Starting Color Game...')">
                <div><i class="fa-solid fa-palette" style="color: #ff5722;"></i> Color Game</div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="list-item" onclick="alert('Starting Dice Game...')">
                <div><i class="fa-solid fa-dice" style="color: #ffffff;"></i> Dice Game</div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="list-item" onclick="alert('Starting Lucky Spin...')">
                <div><i class="fa-solid fa-dharmachakra" style="color: #ffc107;"></i> Lucky Spin</div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <div class="list-item" onclick="alert('Starting Mines...')">
                <div><i class="fa-solid fa-bomb" style="color: #e91e63;"></i> Mines (Diamond/Bomb)</div>
                <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="profileView" class="view-section">
        <button class="back-btn" onclick="showView('mainMenu')"><i class="fa-solid fa-arrow-left"></i> Back to Menu</button>
        
        <div class="profile-card">
            <h3 style="margin-bottom: 15px; color: var(--primary);"><i class="fa-solid fa-id-card"></i> User Details</h3>
            <div class="profile-stat">
                <span class="text-muted">User ID:</span>
                <span>DemoUser123</span>
            </div>
            <div class="profile-stat">
                <span class="text-muted">Deposit Balance:</span>
                <span>₹0.00</span>
            </div>
            <div class="profile-stat">
                <span class="text-muted">Withdrawable:</span>
                <span>₹0.00</span>
            </div>
            <div class="profile-stat">
                <span class="text-muted">UPI ID:</span>
                <span>Not Set</span>
            </div>
        </div>

        <button style="width: 100%; padding: 15px; background: #333; border: 1px solid var(--border); color: white; border-radius: 10px; margin-bottom: 10px; cursor: pointer;">
            <i class="fa-solid fa-clock-rotate-left"></i> Transaction History
        </button>
    </div>

</div>

<script>
    // Simple JavaScript to switch between screens
    function showView(viewId) {
        // Hide all views
        const views = document.querySelectorAll('.view-section');
        views.forEach(view => {
            view.classList.remove('active');
        });

        // Show target view
        document.getElementById(viewId).classList.add('active');
    }
</script>

</body>
</html>
