        async function submitDeposit(btn) { 
            let amt = parseFloat(document.getElementById('depAmt').value);
            let utrInput = document.getElementById('depUtr').value.trim(); 
            let upperInput = utrInput.toUpperCase(); 

            if (isNaN(amt) || amt < 10) return showToast("Please enter correct Amount (Min ₹10).");
            if (utrInput === "") return showToast("Please enter UTR or Transaction ID.");

            let apiPayload = { amount: amt }; let isDigitsOnly = /^\d+$/.test(utrInput); 
            if (isDigitsOnly) { if (utrInput.length !== 12) return showToast("Please enter valid 12-digit UTR."); apiPayload.utr = utrInput; } else { if (!upperInput.startsWith('FMPIB') || utrInput.length < 10) return showToast("Please enter valid Transaction ID."); apiPayload.transaction_id = upperInput; }

            let apiKey = globalPaymentSettings.apiKey;
            
            if(!apiKey) {
                db.ref('deposits').push({ userId: currentUser.id, amt: amt, utr: upperInput, date: new Date().toLocaleString() }); 
                addTxRecord('Deposit', amt, 'Pending', upperInput); 
                setTimeout(() => { showToast("Deposit Request Sent to Admin!"); history.back(); }, 800);
                return;
            }

            try {
                let response = await fetch("https://fampay.rulebreaker.cc/api/v1/payment/verify", { method: "POST", headers: { "Authorization": "Bearer " + apiKey, "Content-Type": "application/json" }, body: JSON.stringify(apiPayload) });
                let resData = await response.json();

                if (resData.success && resData.received) {
                    if (resData.already_verified) { showToast("Transaction already used!"); return; }
                    let finalAmt = resData.amount || amt;
                    currentUser.depositBal = (parseFloat(currentUser.depositBal) || 0) + finalAmt; currentUser.balance = currentUser.depositBal + (parseFloat(currentUser.withdrawBal) || 0);
                    addTxRecord('Deposit', finalAmt, 'Success', upperInput); pushUserNotification(currentUser.id, "Deposit Successful! ✅", `Your deposit of ₹${finalAmt} was verified.`);
                    showToast("Payment Verified!"); setTimeout(() => { updateBalDisplay(); history.back(); }, 1200);
                } else { showToast(resData.message || "Payment not found."); }
            } catch(e) { showToast("Verification server error."); }
        }

        function submitWithdraw() { 
            let amt = parseFloat(document.getElementById('wthAmt').value);
            
            // Yadi user ne abhi naya HTML update nahi kiya hai aur purana interface chala raha hai
            if(!document.getElementById('wthTabBank')) {
                let upi = document.getElementById('wthUpi').value.trim(); 
                if(isNaN(amt) || amt < 100) return showToast("Min withdraw ₹100"); 
                let wthBal = parseFloat(currentUser.withdrawBal) || 0;
                if(amt > wthBal) return showToast(`Insufficient balance! ₹${wthBal.toFixed(2)} available.`); 
                if(upi.length < 5) return showToast("Enter valid UPI"); 
                
                currentUser.withdrawBal = wthBal - amt; currentUser.balance = (parseFloat(currentUser.depositBal) || 0) + currentUser.withdrawBal;
                db.ref('withdrawals').push({ userId: currentUser.id, amt: amt, upi: upi, date: new Date().toLocaleString() }); 
                addTxRecord('Withdraw', amt, 'Pending', null, upi);
                
                setTimeout(() => { updateBalDisplay(); showToast("Withdraw Request Sent!"); history.back(); }, 800); 
                return;
            }

            // Agar naya interface update kar liya hai tab ye chalega:
            if(!selectedWthAccount) return showToast("Please add/select a receiving account!");
            if(isNaN(amt) || amt < 100) return showToast("Min withdraw ₹100"); 
            let wthBal = parseFloat(currentUser.withdrawBal) || 0;
            if(amt > wthBal) return showToast(`Insufficient balance! ₹${wthBal.toFixed(2)} available.`); 
            
            currentUser.withdrawBal = wthBal - amt; currentUser.balance = (parseFloat(currentUser.depositBal) || 0) + currentUser.withdrawBal;
            db.ref('withdrawals').push({ userId: currentUser.id, amt: amt, account: selectedWthAccount, date: new Date().toLocaleString() }); 
            let accInfo = selectedWthAccount.type === 'bank' ? selectedWthAccount.accNo : selectedWthAccount.upiId;
            addTxRecord('Withdraw', amt, 'Pending', null, accInfo);
            
            setTimeout(() => { updateBalDisplay(); document.getElementById('wthAmt').value = ''; showToast("Withdraw Request Sent!"); history.back(); }, 800);

                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="color:var(--primary); letter-spacing:1px; margin:0;">${g.code}</h3>
                        <i class="fa-regular fa-copy" style="cursor:pointer; color:var(--text-muted); font-size:18px;" onclick="navigator.clipboard.writeText('${g.code}'); showToast('Code Copied!');"></i>
                    </div>
                    <p style="font-size:12px; margin-top:8px;"><b>Deposit Req:</b> ₹${g.depReq} | <b>Reward:</b> ${g.reward}</p>
                    <p style="font-size:12px; color:${isExpired ? 'red' : 'green'}; margin-top:3px;"><b>Status:</b> ${isExpired ? 'Expired' : 'Active'} | <b>Claims:</b> ${claimCount}</p>
                    ${claimsHtml}
                </div>`;
            });
        }

        function redeemVIPGiftCode(btn) {
            let code = document.getElementById('giftCodeInput').value.trim().toUpperCase();
            if(!code) return showToast("Enter a code!");
            
            db.ref('giftCodes/' + code).once('value').then(snap => {
                let g = snap.val();
                if(!g) { showToast("Invalid Code!"); return; }
                if(Date.now() > g.expiry) { showToast("Code Expired!"); return; }
                if(g.claimers && g.claimers[currentUser.id]) { showToast("You already claimed this!"); return; }
                
                let hasValidDep = false;
                if(g.depReq === 0) hasValidDep = true;
                else if(currentUser.txHistory) {
                    let sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                    let validDeps = currentUser.txHistory.filter(t => t.type === 'Deposit' && (t.status === 'Success' || t.status === 'Approved') && new Date(t.date).getTime() >= sevenDaysAgo);
                    let totalRecentDep = validDeps.reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                    if(totalRecentDep >= g.depReq) hasValidDep = true;
                }
                
                if(!hasValidDep) { showToast(`You must deposit at least ₹${g.depReq} within the last 7 days to claim!`); return; }
                
                let rAmt = 0;
                if(g.reward.includes('-')) {
                    let parts = g.reward.split('-'); let min = parseInt(parts[0]); let max = parseInt(parts[1]);
                    rAmt = Math.floor(Math.random() * (max - min + 1)) + min;
                } else { rAmt = parseInt(g.reward); }
                
                currentUser.depositBal = (parseFloat(currentUser.depositBal) || 0) + rAmt;
                currentUser.balance = currentUser.depositBal + (parseFloat(currentUser.withdrawBal) || 0);
                addTxRecord('Gift Code', rAmt, 'Credited');
                
                db.ref(`giftCodes/${code}/claimers/${currentUser.id}`).set({ uid: currentUser.uid, amt: rAmt, date: new Date().toLocaleString() }).then(() => {
                    document.getElementById('giftCodeInput').value = '';
                    showToast(`Success! You received ₹${rAmt}`);
                    setTimeout(()=> { updateBalDisplay(); history.back(); }, 1200);
                });
            });
        }

        function sendGlobalNotice() {
            let title = document.getElementById('adminNoticeTitle').value.trim();
            let msg = document.getElementById('adminNoticeMsg').value.trim();
            if(!title || !msg) return showToast("Title and Message required!");
            
            let count = 0;
            Object.keys(usersDB).forEach(uid => { pushUserNotification(uid, title, msg); count++; });
            
            showToast(`Notice sent to ${count} users successfully!`);
            document.getElementById('adminNoticeTitle').value = ''; document.getElementById('adminNoticeMsg').value = '';
        }

    </script>

            if (activeScrn === 'loginScreen' || activeScrn === 'registerScreen' || activeScrn === 'forgotPasswordScreen') { window.tidioChatApi.show(); } else { window.tidioChatApi.hide(); }
            window.tidioChatApi.on("close", function() {
                let currScrn = sessionStorage.getItem('activeScreen') || 'loginScreen';

            });
        });
