<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Cash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e24;
            --primary: #00e676;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Header */
        .header { text-align: center; padding: 20px 0; width: 100%; }
        .header h1 { color: var(--primary); font-size: 28px; }
        .balance-badge { background: transparent; border: 2px solid var(--primary); padding: 8px 20px; border-radius: 20px; display: inline-block; margin-top: 10px; font-weight: bold; font-size: 18px; }
        
        /* Containers */
        .container { width: 90%; max-width: 400px; margin-top: 20px; display: none; }
        .active { display: block; }
        
        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2a2a32; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .switch-form { text-align: center; margin-top: 15px; color: var(--primary); cursor: pointer; }

        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card-bg); padding: 20px 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card i { font-size: 24px; color: var(--primary); margin-bottom: 10px; }
        .card:active { background: #2a2a32; }

        /* Game UI */
        .game-box { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; }
        .game-result { font-size: 20px; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Metro Cash</h1>
        <div class="balance-badge" id="balBadge" style="display: none;">₹ <span id="userBal">0.00</span></div>
    </div>

    <!-- Auth Screen -->
    <div class="container active" id="authScreen">
        <h2 style="text-align: center; margin-bottom: 20px;" id="authTitle">Login</h2>
        <div class="form-group">
            <input type="text" id="username" placeholder="Username / User ID">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password">
        </div>
        <button class="btn" onclick="handleAuth()">Submit</button>
        <div class="switch-form" onclick="toggleAuth()">Naya account banayein? Register here</div>
    </div>

    <!-- Dashboard Screen -->
    <div class="container" id="dashScreen">
        <div class="grid">
            <div class="card"><i class="fa-solid fa-user"></i><p>Profile</p></div>
            <div class="card" onclick="openGame()"><i class="fa-solid fa-gamepad"></i><p>Bet & Earn</p></div>
            <div class="card"><i class="fa-solid fa-download"></i><p>Deposit</p></div>
            <div class="card"><i class="fa-solid fa-building-columns"></i><p>Withdraw</p></div>
            <div class="card"><i class="fa-solid fa-gift"></i><p>Bonus</p></div>
            <div class="card"><i class="fa-solid fa-users"></i><p>Refer & Earn</p></div>
        </div>
    </div>

    <!-- Game Screen (Coin Toss) -->
    <div class="container" id="gameScreen">
        <div class="game-box">
            <h2>🪙 Coin Toss</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Multiplier: 1.9x</p>
            <input type="number" id="betAmount" placeholder="Bet Amount (Min ₹5)" style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a32; color: white; border: none; border-radius: 8px;">
            <div class="grid">
                <button class="btn" onclick="playGame('head')">Head</button>
                <button class="btn" onclick="playGame('tail')">Tail</button>
            </div>
            <div class="game-result" id="gameResult"></div>
            <button class="btn" style="background: #444; color: white; margin-top: 20px;" onclick="closeGame()">Back to Home</button>
        </div>
    </div>
    <script>
        let isLogin = true;
        let balance = 100.00; // Default demo balance

        // Switch between Login and Register
        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? "Login" : "Register";
            document.querySelector('.switch-form').innerText = isLogin ? "Naya account banayein? Register here" : "Pehle se account hai? Login here";
        }

        // Handle Login/Register
        function handleAuth() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            if(user.length < 3 || pass.length < 3) {
                alert("Please enter valid details!");
                return;
            }
            // Switch UI to Dashboard
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('dashScreen').classList.add('active');
            document.getElementById('balBadge').style.display = "inline-block";
            updateBalance();
        }

        function updateBalance() {
            document.getElementById('userBal').innerText = balance.toFixed(2);
        }

        // Open/Close Game Screen
        function openGame() {
            document.getElementById('dashScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameResult').innerText = "";
        }

        function closeGame() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('dashScreen').classList.add('active');
        }

        // Play Game Logic (Coin Toss)
        function playGame(choice) {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(isNaN(bet) || bet < 5) {
                alert("Minimum bet ₹5 hai!"); return;
            }
            if(bet > balance) {
                alert("Balance kam hai!"); return;
            }

            // Deduct bet
            balance -= bet;
            updateBalance();
            document.getElementById('gameResult').innerHTML = "<i>Tossing Coin... 🪙</i>";
            document.getElementById('gameResult').style.color = "white";

            setTimeout(() => {
                // 50% Win Chance
                let isWin = Math.random() < 0.5; 
                if(isWin) {
                    let winAmt = bet * 1.9; // Multiplier from bot
                    balance += winAmt;
                    document.getElementById('gameResult').innerText = "🎉 You Won! +" + winAmt.toFixed(2);
                    document.getElementById('gameResult').style.color = "#00e676";
                } else {
                    document.getElementById('gameResult').innerText = "😢 You Lost! -" + bet.toFixed(2);
                    document.getElementById('gameResult').style.color = "#ff4444";
                }
                updateBalance();
            }, 1500);
        }
    </script>
</body>
</html>
