<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinGo Complete Bet Modal</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #f0f0f0;
    padding: 20px;
  }

  .container {
    max-width: 400px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 14px;
    font-weight: bold;
    color: #444;
    margin: 15px 0 8px 0;
  }

  /* Color Buttons */
  .color-board {
    display: flex;
    gap: 10px;
  }
  .color-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  .green { background: #4caf50; }
  .violet { background: #9c27b0; }
  .red { background: #f44336; }

  /* Size Buttons */
  .size-board {
    display: flex;
    gap: 10px;
  }
  .size-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    background: #ff9800;
  }

  /* Number Grid */
  .number-board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .number-btn {
    padding: 12px 0;
    background: white;
    color: #333;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .number-btn:active {
    background: #eee;
  }

  /* Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1000;
  }

  .modal-overlay.active {
    visibility: visible;
    opacity: 1;
  }

  /* Modal Content */
  .modal-content {
    background: #fff;
    width: 100%;
    max-width: 400px;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    overflow: hidden;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  .modal-overlay.active .modal-content {
    transform: translateY(0);
  }

  /* Header Section */
  .modal-header {
    background: #ff4747;
    color: white;
    text-align: center;
    padding: 15px 10px 30px 10px;
    position: relative;
  }

  .modal-header h2 {
    font-size: 18px;
    margin-bottom: 10px;
  }

  .selection-box {
    background: white;
    color: #333;
    width: 80%;
    margin: 0 auto;
    padding: 8px;
    border-radius: 5px;
    font-weight: bold;
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* Body Section */
  .modal-body {
    padding: 35px 20px 20px 20px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
  }

  .row > span {
    font-size: 14px;
    color: #666;
    width: 70px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .btn-group button {
    background: #f1f1f1;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    color: #333;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-group button.active {
    background: #ff4747;
    color: white;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .qty-control button {
    background: #ff4747;
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
  }

  .qty-control input {
    width: 50px;
    height: 30px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
  }

  .agreement {
    justify-content: flex-start;
    gap: 10px;
    margin-top: 20px;
  }

  .agreement input[type="checkbox"] {
    accent-color: #ff4747;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .agreement label {
    font-size: 13px;
    color: #333;
  }

  .agreement label span {
    color: #ff4747;
    cursor: pointer;
  }

  /* Footer */
  .modal-footer {
    display: flex;
    height: 50px;
  }

  .modal-footer button {
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-cancel {
    background: #333;
    color: white;
    flex: 1;
  }

  .btn-confirm {
    background: #ff4747;
    color: white;
    flex: 2;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Color Betting Options -->
  <div class="section-title">Colors par Bet lagayein:</div>
  <div class="color-board">
    <button class="color-btn green" onclick="openBetModal('Green')">Green</button>
    <button class="color-btn violet" onclick="openBetModal('Violet')">Violet</button>
    <button class="color-btn red" onclick="openBetModal('Red')">Red</button>
  </div>

  <!-- Size Betting Options -->
  <div class="section-title">Size par Bet lagayein:</div>
  <div class="size-board">
    <button class="size-btn" onclick="openBetModal('Big')">Big</button>
    <button class="size-btn" onclick="openBetModal('Small')">Small</button>
  </div>

  <!-- Number Betting Options -->
  <div class="section-title">Numbers par Bet lagayein:</div>
  <div class="number-board">
    <button class="number-btn" onclick="openBetModal(0)">0</button>
    <button class="number-btn" onclick="openBetModal(1)">1</button>
    <button class="number-btn" onclick="openBetModal(2)">2</button>
    <button class="number-btn" onclick="openBetModal(3)">3</button>
    <button class="number-btn" onclick="openBetModal(4)">4</button>
    <button class="number-btn" onclick="openBetModal(5)">5</button>
    <button class="number-btn" onclick="openBetModal(6)">6</button>
    <button class="number-btn" onclick="openBetModal(7)">7</button>
    <button class="number-btn" onclick="openBetModal(8)">8</button>
    <button class="number-btn" onclick="openBetModal(9)">9</button>
  </div>
</div>

<!-- Modal Structure -->
<div class="modal-overlay" id="betModal">
  <div class="modal-content">
    
    <div class="modal-header">
      <h2>WinGo 1 minute</h2>
      <div class="selection-box" id="selectionText">Select 0</div>
    </div>

    <div class="modal-body">
      <!-- Balance Selection -->
      <div class="row">
        <span>Balance</span>
        <div class="btn-group" id="balanceGroup">
          <button class="active" data-val="1">1</button>
          <button data-val="10">10</button>
          <button data-val="100">100</button>
          <button data-val="1000">1000</button>
        </div>
      </div>

      <!-- Quantity Selection -->
      <div class="row">
        <span>Quantity</span>
        <div class="qty-control">
          <button onclick="changeQty(-1)">-</button>
          <input type="number" id="qtyInput" value="1" readonly>
          <button onclick="changeQty(1)">+</button>
        </div>
      </div>

      <!-- Multiplier Selection -->
      <div class="row">
        <div class="btn-group" id="multiplierGroup" style="justify-content: flex-start;">
          <button class="active" data-val="1">X1</button>
          <button data-val="5">X5</button>
          <button data-val="10">X10</button>
          <button data-val="20">X20</button>
          <button data-val="50">X50</button>
          <button data-val="100">X100</button>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="row agreement">
        <input type="checkbox" id="agreeChk" checked>
        <label for="agreeChk">I agree <span>《Pre-sale rules》</span></label>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="submitBet()">Total amount ₹<span id="totalDisplay">1.00</span></button>
    </div>

  </div>
</div>

<script>
  let selectedBetValue = '';
  let currentBalance = 1;
  let currentQty = 1;
  let currentMultiplier = 1;

  // Har ek betting button ke click par modal khulega
  function openBetModal(betName) {
    selectedBetValue = betName;
    document.getElementById('selectionText').innerText = `Select ${betName}`;
    document.getElementById('betModal').classList.add('active');
    updateTotal();
  }

  function closeModal() {
    document.getElementById('betModal').classList.remove('active');
  }

  // Total Amount Calculation
  function updateTotal() {
    const total = currentBalance * currentQty * currentMultiplier;
    document.getElementById('totalDisplay').innerText = total.toFixed(2);
  }

  // Balance Buttons Active & Logic
  const balanceBtns = document.querySelectorAll('#balanceGroup button');
  balanceBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      balanceBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentBalance = parseInt(e.target.getAttribute('data-val'));
      updateTotal();
    });
  });

  // Multiplier Buttons Active & Logic
  const multiplierBtns = document.querySelectorAll('#multiplierGroup button');
  multiplierBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      multiplierBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentMultiplier = parseInt(e.target.getAttribute('data-val'));
      updateTotal();
    });
  });

  // Quantity Plus / Minus Logic
  function changeQty(amount) {
    let newQty = currentQty + amount;
    if (newQty < 1) newQty = 1;
    currentQty = newQty;
    document.getElementById('qtyInput').value = currentQty;
    updateTotal();
  }

  // Final Submit Bet Action
  function submitBet() {
    const agree = document.getElementById('agreeChk').checked;
    if (!agree) {
      alert("Please agree to the Pre-sale rules.");
      return;
    }
    const finalAmount = (currentBalance * currentQty * currentMultiplier).toFixed(2);
    alert(`Success! Bet placed on [${selectedBetValue}] with Total Amount ₹${finalAmount}`);
    closeModal();
  }
</script>

</body>
</html>
